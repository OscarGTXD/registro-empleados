<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Capitol Shine - Registro de Detailing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            padding: 10px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(255, 200, 0, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 200, 0, 0.03) 0%, transparent 50%);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 5px;
        }

        .main-card {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 200, 0, 0.1);
            border: 1px solid rgba(255, 200, 0, 0.08);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 200, 0, 0.15);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 5px;
        }

        .header .logo-icon {
            font-size: 35px;
        }

        .header h1 {
            color: #ffd700;
            font-size: 1.8em;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
        }

        .header .subtitle {
            color: #888;
            font-size: 0.8em;
            letter-spacing: 1px;
        }

        .header .subtitle span {
            color: #ffd700;
        }

        .idioma-selector {
            display: flex;
            gap: 5px;
        }

        .idioma-selector button {
            padding: 4px 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 11px;
            color: #888;
        }

        .idioma-selector button:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
        }

        .idioma-selector button.active {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border-color: #ffd700;
        }

        /* ===== SECCIONES ===== */
        .section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section-title {
            color: #ffd700;
            font-size: 1em;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title .badge {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* ===== FORMULARIOS ===== */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

        .form-group label {
            font-weight: 600;
            color: #aaa;
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 16px;
            color: #fff;
            transition: all 0.3s;
            width: 100%;
            min-height: 48px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }

        .form-group input::placeholder {
            color: #555;
        }

        /* ===== BOTONES GRANDES ===== */
        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a0a;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #ffe44d, #ffb700);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.25);
        }

        .btn-success {
            background: linear-gradient(135deg, #00c853, #00a844);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #00e676, #00c853);
            box-shadow: 0 10px 40px rgba(0, 200, 80, 0.25);
        }

        .btn-danger {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            box-shadow: 0 10px 40px rgba(211, 47, 47, 0.25);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f57c00, #e65100);
            color: white;
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            box-shadow: 0 10px 40px rgba(245, 124, 0, 0.25);
        }

        .btn-info {
            background: linear-gradient(135deg, #0288d1, #01579b);
            color: white;
        }

        .btn-info:hover {
            background: linear-gradient(135deg, #039be5, #0288d1);
            box-shadow: 0 10px 40px rgba(2, 136, 209, 0.25);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
            min-height: 36px;
            width: auto;
        }

        .btn-xs {
            padding: 4px 10px;
            font-size: 10px;
            min-height: 28px;
            width: auto;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-group .btn {
            flex: 1;
            min-width: 120px;
        }

        /* ===== INFO DÍA ACTUAL ===== */
        .dia-actual-box {
            background: rgba(255, 215, 0, 0.06);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid rgba(255, 215, 0, 0.08);
            margin-bottom: 12px;
        }

        .dia-actual-box .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dia-actual-box .fecha {
            color: #ffd700;
            font-weight: 700;
            font-size: 16px;
        }

        .dia-actual-box .empleado {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        /* ===== TABLA ===== */
        .table-wrapper {
            overflow-x: auto;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 500px;
        }

        th {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            padding: 8px 6px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.1);
            white-space: nowrap;
        }

        td {
            padding: 6px 6px;
            color: #ccc;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 11px;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* ===== ESTADÍSTICAS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 12px 0;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stats-card .number {
            font-size: 22px;
            font-weight: 900;
            color: #ffd700;
        }

        .stats-card .label {
            font-size: 9px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .stats-card.green .number { color: #4caf50; }
        .stats-card.orange .number { color: #ff9800; }
        .stats-card.purple .number { color: #ce93d8; }

        /* ===== REGISTROS ===== */
        .registro-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-wrap: wrap;
            gap: 6px;
        }

        .registro-item .info {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }

        .registro-item .info .auto {
            color: #fff;
            font-weight: 600;
            font-size: 13px;
        }

        .registro-item .info .detalle {
            color: #888;
            font-size: 11px;
        }

        .registro-item .info .monto {
            color: #ffd700;
            font-weight: 600;
            font-size: 12px;
        }

        .registro-item .acciones {
            display: flex;
            gap: 4px;
        }

        .registro-item .numero-auto {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
        }

        /* ===== MENSAJES ===== */
        .mensaje {
            padding: 10px 16px;
            border-radius: 10px;
            margin: 8px 0;
            font-weight: 500;
            font-size: 13px;
        }

        .mensaje-exito {
            background: rgba(0, 200, 80, 0.1);
            color: #69f0ae;
            border-left: 4px solid #00c853;
        }

        .mensaje-error {
            background: rgba(211, 47, 47, 0.1);
            color: #ef9a9a;
            border-left: 4px solid #d32f2f;
        }

        .mensaje-info {
            background: rgba(2, 136, 209, 0.1);
            color: #81d4fa;
            border-left: 4px solid #0288d1;
        }

        /* ===== FOOTER ===== */
        .footer-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.05);
        }

        .footer-actions .btn {
            flex: 1;
            min-width: 100px;
            max-width: 180px;
            min-height: 44px;
            font-size: 13px;
            padding: 12px 16px;
        }

        .hidden {
            display: none !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 6px;
            }
            .main-card {
                padding: 12px;
                border-radius: 14px;
            }
            .header h1 {
                font-size: 1.4em;
            }
            .header .logo-icon {
                font-size: 28px;
            }
            .section {
                padding: 12px;
                margin-bottom: 12px;
            }
            .btn {
                font-size: 14px;
                padding: 14px 20px;
                min-height: 50px;
            }
            .footer-actions .btn {
                min-width: 80px;
                font-size: 12px;
                padding: 10px 14px;
                min-height: 40px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            .stats-card .number {
                font-size: 18px;
            }
            .dia-actual-box {
                flex-direction: column;
                text-align: center;
            }
            .btn-group .btn {
                min-width: 100%;
            }
            .registro-item .info {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .registro-item .acciones {
                width: 100%;
                justify-content: flex-end;
            }
        }

        @media print {
            .btn, .footer-actions, .idioma-selector, .btn-group {
                display: none !important;
            }
            .main-card {
                background: white !important;
                padding: 10px !important;
                box-shadow: none !important;
            }
            body {
                background: white !important;
                padding: 10px !important;
            }
            .header h1 { color: #000 !important; }
            .section { border-color: #ccc !important; background: #f9f9f9 !important; }
            th { background: #333 !important; color: white !important; }
            td { color: #333 !important; }
            .stats-card .number { color: #000 !important; }
            .dia-actual-box { border-color: #ccc !important; }
            .dia-actual-box .fecha { color: #000 !important; }
            .dia-actual-box .empleado { color: #000 !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">

            <!-- ===== HEADER ===== -->
            <div class="header">
                <div class="header-top">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="logo-icon">✨</span>
                        <div style="text-align:left;">
                            <h1 style="font-size:1.4em;">CAPITOL SHINE</h1>
                            <p class="subtitle" style="font-size:0.65em;">Detailing &amp; Auto Spa · <span id="headerSubtitle">Registro</span></p>
                        </div>
                    </div>
                    <div class="idioma-selector">
                        <button class="active" onclick="cambiarIdioma('es')" id="btnEs">🇪🇸 ES</button>
                        <button onclick="cambiarIdioma('en')" id="btnEn">🇬🇧 EN</button>
                    </div>
                </div>
            </div>

            <!-- ===== CONFIGURACIÓN ===== -->
            <div id="configSection" class="section">
                <div class="section-title" id="lblConfigTitle">👤 Iniciar Día</div>
                <div class="form-group">
                    <label id="lblEmployeeName">Nombre del Empleado</label>
                    <input type="text" id="empleadoNombre" placeholder="Ej: Juan Pérez" required>
                </div>
                <button class="btn btn-gold" onclick="iniciarJornada()" id="btnStart">🚀 Iniciar Día</button>
                <div id="mensajeConfig" style="margin-top:10px;"></div>
            </div>

            <!-- ===== REGISTRO RÁPIDO ===== -->
            <div id="registroSection" class="section hidden">
                <div class="section-title" id="lblRegisterTitle">🚗 Agregar Auto <span class="badge" id="lblNewRecord">Nuevo</span></div>

                <!-- INFO DEL DÍA ACTUAL -->
                <div class="dia-actual-box">
                    <div>
                        <div class="label" id="lblCurrentDay">📅 Día actual</div>
                        <div class="fecha" id="fechaActualDisplay">--/--/----</div>
                    </div>
                    <div>
                        <div class="label" id="lblEmployee">👤 Empleado</div>
                        <div class="empleado" id="empleadoActualDisplay">---</div>
                    </div>
                    <div>
                        <div class="label" id="lblVehiclesToday">🚗 Autos hoy</div>
                        <div class="fecha" id="autosHoyDisplay">0</div>
                    </div>
                </div>

                <!-- CAMPOS RÁPIDOS -->
                <div class="form-group">
                    <label id="lblEntryTime">🕐 Hora Entrada</label>
                    <input type="time" id="horaEntrada" required>
                </div>
                <div class="form-group">
                    <label id="lblExitTime">🕐 Hora Salida</label>
                    <input type="time" id="horaSalida" required>
                </div>
                <div class="form-group">
                    <label id="lblVehicle">🚗 Auto</label>
                    <input type="text" id="auto" placeholder="Ej: Toyota Corolla">
                </div>
                <div class="form-group">
                    <label id="lblService">🔧 Servicio</label>
                    <input type="text" id="servicio" placeholder="Ej: Detailing">
                </div>
                <div class="form-group">
                    <label id="lblCharge">💰 Cobro ($)</label>
                    <input type="number" id="cobro" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label id="lblTip">💵 Propina ($)</label>
                    <input type="number" id="propina" placeholder="0.00" step="0.01">
                </div>

                <button class="btn btn-success" onclick="agregarAuto()" id="btnAddVehicle">➕ Agregar Auto</button>
                <div id="mensajeRegistro" style="margin-top:10px;"></div>
            </div>

            <!-- ===== LISTA DE REGISTROS ===== -->
            <div id="listaSection" class="section hidden">
                <div class="section-title" id="lblListTitle">📊 Registros <span class="badge" id="totalAutosBadge">0 autos</span></div>

                <div class="stats-grid" id="statsGrid">
                    <div class="stats-card blue">
                        <div class="number" id="totalAutos">0</div>
                        <div class="label" id="lblTotalVehicles">Autos</div>
                    </div>
                    <div class="stats-card purple">
                        <div class="number" id="totalHoras">0h</div>
                        <div class="label" id="lblTotalHours">Horas</div>
                    </div>
                    <div class="stats-card green">
                        <div class="number" id="totalCobros">$0</div>
                        <div class="label" id="lblTotalCharges">Cobros</div>
                    </div>
                    <div class="stats-card orange">
                        <div class="number" id="totalPropinas">$0</div>
                        <div class="label" id="lblTotalTips">Propinas</div>
                    </div>
                </div>

                <div id="registrosList"></div>

                <div class="footer-actions">
                    <button class="btn btn-gold" onclick="exportarExcel()" id="btnExportExcel">📊 Excel</button>
                    <button class="btn btn-info" onclick="window.print()" id="btnPrint">🖨️ Imprimir</button>
                    <button class="btn btn-danger" onclick="limpiarTodo()" id="btnClearAll">🗑️ Limpiar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ IDIOMAS ============
        const textos = {
            es: {
                subtitle: 'Registro',
                configTitle: '👤 Iniciar Día',
                employeeName: 'Nombre del Empleado',
                start: '🚀 Iniciar Día',
                registerTitle: '🚗 Agregar Auto',
                newRecord: 'Nuevo',
                entryTime: '🕐 Hora Entrada',
                exitTime: '🕐 Hora Salida',
                vehicle: '🚗 Auto',
                service: '🔧 Servicio',
                charge: '💰 Cobro ($)',
                tip: '💵 Propina ($)',
                addVehicle: '➕ Agregar Auto',
                listTitle: '📊 Registros',
                totalVehicles: 'Autos',
                totalHours: 'Horas',
                totalCharges: 'Cobros',
                totalTips: 'Propinas',
                exportExcel: '📊 Excel',
                print: '🖨️ Imprimir',
                clearAll: '🗑️ Limpiar',
                startSuccess: '✅ Día iniciado para ',
                startError: '⚠️ Ingresa tu nombre.',
                recordSuccess: '✅ Auto "',
                recordError: '⚠️ Ingresa hora de entrada y salida.',
                deleteConfirm: '¿Eliminar este registro?',
                clearConfirm: '⚠️ ¿Borrar TODOS los registros?',
                noRecords: 'No hay autos registrados aún.\n¡Comienza a trabajar!',
                exportEmpty: '⚠️ No hay registros para exportar.',
                deleteMsg: '🗑️ Registro eliminado.',
                clearMsg: '🗑️ Todos los registros eliminados.',
                currentDay: '📅 Día actual',
                employee: '👤 Empleado',
                vehiclesToday: '🚗 Autos hoy',
                auto: 'auto',
                autos: 'autos'
            },
            en: {
                subtitle: 'Log',
                configTitle: '👤 Start Day',
                employeeName: 'Employee Name',
                start: '🚀 Start Day',
                registerTitle: '🚗 Add Vehicle',
                newRecord: 'New',
                entryTime: '🕐 Entry Time',
                exitTime: '🕐 Exit Time',
                vehicle: '🚗 Vehicle',
                service: '🔧 Service',
                charge: '💰 Charge ($)',
                tip: '💵 Tip ($)',
                addVehicle: '➕ Add Vehicle',
                listTitle: '📊 Records',
                totalVehicles: 'Vehicles',
                totalHours: 'Hours',
                totalCharges: 'Charges',
                totalTips: 'Tips',
                exportExcel: '📊 Excel',
                print: '🖨️ Print',
                clearAll: '🗑️ Clear',
                startSuccess: '✅ Day started for ',
                startError: '⚠️ Enter your name.',
                recordSuccess: '✅ Vehicle "',
                recordError: '⚠️ Enter entry and exit time.',
                deleteConfirm: 'Delete this record?',
                clearConfirm: '⚠️ Delete ALL records?',
                noRecords: 'No vehicles registered yet.\nStart working!',
                exportEmpty: '⚠️ No records to export.',
                deleteMsg: '🗑️ Record deleted.',
                clearMsg: '🗑️ All records deleted.',
                currentDay: '📅 Current day',
                employee: '👤 Employee',
                vehiclesToday: '🚗 Vehicles today',
                auto: 'vehicle',
                autos: 'vehicles'
            }
        };

        let idiomaActual = 'es';

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            document.getElementById('btnEs').classList.toggle('active', idioma === 'es');
            document.getElementById('btnEn').classList.toggle('active', idioma === 'en');
            
            const t = textos[idioma];
            document.getElementById('headerSubtitle').textContent = t.subtitle;
            document.getElementById('lblConfigTitle').textContent = t.configTitle;
            document.getElementById('lblEmployeeName').textContent = t.employeeName;
            document.getElementById('btnStart').textContent = t.start;
            document.getElementById('lblRegisterTitle').innerHTML = t.registerTitle + ' <span class="badge" id="lblNewRecord">' + t.newRecord + '</span>';
            document.getElementById('lblEntryTime').textContent = t.entryTime;
            document.getElementById('lblExitTime').textContent = t.exitTime;
            document.getElementById('lblVehicle').textContent = t.vehicle;
            document.getElementById('lblService').textContent = t.service;
            document.getElementById('lblCharge').textContent = t.charge;
            document.getElementById('lblTip').textContent = t.tip;
            document.getElementById('btnAddVehicle').textContent = t.addVehicle;
            document.getElementById('lblListTitle').innerHTML = t.listTitle + ' <span class="badge" id="totalAutosBadge">0 ' + t.autos + '</span>';
            document.getElementById('lblTotalVehicles').textContent = t.totalVehicles;
            document.getElementById('lblTotalHours').textContent = t.totalHours;
            document.getElementById('lblTotalCharges').textContent = t.totalCharges;
            document.getElementById('lblTotalTips').textContent = t.totalTips;
            document.getElementById('btnExportExcel').textContent = t.exportExcel;
            document.getElementById('btnPrint').textContent = t.print;
            document.getElementById('btnClearAll').textContent = t.clearAll;
            document.getElementById('lblCurrentDay').textContent = t.currentDay;
            document.getElementById('lblEmployee').textContent = t.employee;
            document.getElementById('lblVehiclesToday').textContent = t.vehiclesToday;
        }

        // ============ VARIABLES ============
        let registros = [];
        let empleadoActual = '';
        let fechaActual = '';

        // ============ INICIALIZAR ============
        function getFechaHoy() {
            const hoy = new Date();
            const year = hoy.getFullYear();
            const month = String(hoy.getMonth() + 1).padStart(2, '0');
            const day = String(hoy.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const month = parts[1];
            const day = parts[2];
            const year = parts[0];
            return `${month}/${day}/${year}`;
        }

        // ============ INICIAR DÍA ============
        function iniciarJornada() {
            const nombre = document.getElementById('empleadoNombre').value.trim();
            const t = textos[idiomaActual];

            if (!nombre) {
                mostrarMensaje('configSection', t.startError, 'error');
                return;
            }

            empleadoActual = nombre;
            fechaActual = getFechaHoy();
            registros = [];

            document.getElementById('configSection').classList.add('hidden');
            document.getElementById('registroSection').classList.remove('hidden');
            document.getElementById('listaSection').classList.remove('hidden');

            // Actualizar info del día
            document.getElementById('fechaActualDisplay').textContent = formatDateDisplay(fechaActual);
            document.getElementById('empleadoActualDisplay').textContent = empleadoActual;
            document.getElementById('autosHoyDisplay').textContent = '0';

            mostrarMensaje('configSection', t.startSuccess + nombre, 'exito');
            actualizarLista();
        }

        // ============ AGREGAR AUTO ============
        function agregarAuto() {
            const t = textos[idiomaActual];
            const horaEntrada = document.getElementById('horaEntrada').value;
            const horaSalida = document.getElementById('horaSalida').value;
            const auto = document.getElementById('auto').value.trim() || 'No especificado';
            const servicio = document.getElementById('servicio').value.trim() || 'No especificado';
            const cobro = parseFloat(document.getElementById('cobro').value) || 0;
            const propina = parseFloat(document.getElementById('propina').value) || 0;

            if (!horaEntrada || !horaSalida) {
                mostrarMensaje('registroSection', t.recordError, 'error');
                return;
            }

            const horas = calcularHoras(horaEntrada, horaSalida);

            const registro = {
                fecha: fechaActual,
                horaEntrada: horaEntrada,
                horaSalida: horaSalida,
                horas: horas,
                auto: auto,
                servicio: servicio,
                cobro: cobro,
                propina: propina
            };

            registros.push(registro);
            actualizarLista();

            // Actualizar contador de autos hoy
            const autosHoy = registros.filter(r => r.fecha === fechaActual).length;
            document.getElementById('autosHoyDisplay').textContent = autosHoy;

            // Limpiar campos (menos la fecha que está fija)
            document.getElementById('horaEntrada').value = '';
            document.getElementById('horaSalida').value = '';
            document.getElementById('auto').value = '';
            document.getElementById('servicio').value = '';
            document.getElementById('cobro').value = '';
            document.getElementById('propina').value = '';

            // Poner el foco en hora entrada para el siguiente auto
            document.getElementById('horaEntrada').focus();

            mostrarMensaje('registroSection', t.recordSuccess + auto + '" registrado.', 'exito');
        }

        // ============ ELIMINAR AUTO ============
        function eliminarAuto(index) {
            const t = textos[idiomaActual];
            if (confirm(t.deleteConfirm)) {
                registros.splice(index, 1);
                actualizarLista();
                
                // Actualizar contador de autos hoy
                const autosHoy = registros.filter(r => r.fecha === fechaActual).length;
                document.getElementById('autosHoyDisplay').textContent = autosHoy;
                
                mostrarMensaje('listaSection', t.deleteMsg, 'info');
            }
        }

        // ============ LIMPIAR TODO ============
        function limpiarTodo() {
            const t = textos[idiomaActual];
            if (confirm(t.clearConfirm)) {
                registros = [];
                actualizarLista();
                document.getElementById('autosHoyDisplay').textContent = '0';
                mostrarMensaje('listaSection', t.clearMsg, 'info');
            }
        }

        // ============ ACTUALIZAR LISTA ============
        function actualizarLista() {
            const container = document.getElementById('registrosList');
            const t = textos[idiomaActual];

            if (registros.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#555; padding:20px;">${t.noRecords.replace(/\n/g, '<br>')}</p>`;
                actualizarEstadisticas();
                document.getElementById('totalAutosBadge').textContent = `0 ${t.autos}`;
                return;
            }

            let html = '';
            // Mostrar todos los registros en orden (más reciente primero)
            const registrosReves = [...registros].reverse();
            
            registrosReves.forEach((r, i) => {
                const indexReal = registros.length - 1 - i;
                const horasFormateadas = formatearHoras(r.horas);
                const numAuto = i + 1;
                
                html += `
                    <div class="registro-item">
                        <div class="info">
                            <span class="numero-auto">#${numAuto}</span>
                            <span class="auto">🚗 ${r.auto}</span>
                            <span class="detalle">⏱ ${r.horaEntrada} - ${r.horaSalida} · ${horasFormateadas}</span>
                            <span class="detalle">🔧 ${r.servicio}</span>
                            <span class="monto">💰 $${r.cobro.toFixed(2)}</span>
                            <span class="monto" style="color:#ff9800;">💵 $${r.propina.toFixed(2)}</span>
                        </div>
                        <div class="acciones">
                            <button class="btn btn-danger btn-xs" onclick="eliminarAuto(${indexReal})">🗑️</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            actualizarEstadisticas();

            const plural = registros.length > 1 ? t.autos : t.auto;
            document.getElementById('totalAutosBadge').textContent = `${registros.length} ${plural}`;
        }

        // ============ ESTADÍSTICAS ============
        function actualizarEstadisticas() {
            document.getElementById('totalAutos').textContent = registros.length;

            const totalHoras = registros.reduce((sum, r) => sum + r.horas, 0);
            document.getElementById('totalHoras').textContent = formatearHoras(totalHoras);

            const totalCobro = registros.reduce((sum, r) => sum + r.cobro, 0);
            document.getElementById('totalCobros').textContent = `$${totalCobro.toFixed(2)}`;

            const totalPropina = registros.reduce((sum, r) => sum + r.propina, 0);
            document.getElementById('totalPropinas').textContent = `$${totalPropina.toFixed(2)}`;
        }

        // ============ EXPORTAR A EXCEL ============
        function exportarExcel() {
            const t = textos[idiomaActual];

            if (registros.length === 0) {
                alert(t.exportEmpty);
                return;
            }

            const headers = ['#', 'Fecha', 'Hora Entrada', 'Hora Salida', 'Horas', 'Auto', 'Servicio', 'Cobro', 'Propina'];
            let csv = headers.join(',') + '\n';

            registros.forEach((r, i) => {
                const row = [
                    i + 1,
                    formatDateDisplay(r.fecha),
                    r.horaEntrada,
                    r.horaSalida,
                    r.horas.toFixed(2).replace('.', ','),
                    `"${r.auto}"`,
                    `"${r.servicio}"`,
                    r.cobro.toFixed(2).replace('.', ','),
                    r.propina.toFixed(2).replace('.', ',')
                ];
                csv += row.join(',') + '\n';
            });

            const totalHoras = registros.reduce((sum, r) => sum + r.horas, 0);
            const totalCobro = registros.reduce((sum, r) => sum + r.cobro, 0);
            const totalPropina = registros.reduce((sum, r) => sum + r.propina, 0);

            csv += '\nTOTALES,,,,,' + totalHoras.toFixed(2).replace('.', ',') + ',,' + totalCobro.toFixed(2).replace('.', ',') + ',' + totalPropina.toFixed(2).replace('.', ',');

            csv += `\n\nEmpleado: ${empleadoActual}`;
            csv += `\nFecha: ${formatDateDisplay(fechaActual)}`;
            csv += `\nCapitol Shine - Detailing & Auto Spa`;

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `CapitolShine_${empleadoActual}_${fechaActual}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ============ CÁLCULO DE HORAS ============
        function calcularHoras(entrada, salida) {
            const [h1, m1] = entrada.split(':').map(Number);
            const [h2, m2] = salida.split(':').map(Number);
            let horas = h2 - h1;
            let minutos = m2 - m1;
            if (minutos < 0) {
                horas--;
                minutos += 60;
            }
            if (horas < 0) horas += 24;
            return horas + (minutos / 60);
        }

        function formatearHoras(horas) {
            if (!horas || horas === 0) return '0h';
            const h = Math.floor(horas);
            const m = Math.round((horas - h) * 60);
            if (m === 0) return `${h}h`;
            return `${h}h ${m}min`;
        }

        // ============ MENSAJES ============
        function mostrarMensaje(sectionId, mensaje, tipo) {
            const section = document.getElementById(sectionId);
            const container = section.querySelector('.mensaje') || section;
            const existing = container.querySelector('.mensaje');
            if (existing) existing.remove();

            const div = document.createElement('div');
            div.className = `mensaje mensaje-${tipo}`;
            div.textContent = mensaje;
            container.appendChild(div);

            setTimeout(() => {
                if (div.parentNode) div.remove();
            }, 4000);
        }

        // ============ INICIALIZAR ============
        console.log('✨ Capitol Shine - Sistema Simplificado');
        console.log('🚀 2 BOTONES: Iniciar Día + Agregar Auto');
        console.log('📱 Optimizado para PC y Celular');
        console.log('🌍 Idiomas: Español/Inglés');
    </script>
</body>
