<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitol Shine - Registro de Detailing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(255, 200, 0, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 200, 0, 0.03) 0%, transparent 50%);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .main-card {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 200, 0, 0.1);
            border: 1px solid rgba(255, 200, 0, 0.08);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(255, 200, 0, 0.15);
        }

        .header .logo-icon {
            font-size: 55px;
            display: block;
            margin-bottom: 5px;
        }

        .header h1 {
            color: #ffd700;
            font-size: 2.8em;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
            font-family: 'Arial Black', sans-serif;
        }

        .header .subtitle {
            color: #888;
            font-size: 1em;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .header .subtitle span {
            color: #ffd700;
        }

        /* ===== SECCIONES ===== */
        .section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .section:hover {
            border-color: rgba(255, 215, 0, 0.15);
        }

        .section h2 {
            color: #ffd700;
            font-size: 1.2em;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .section h2 .badge {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* ===== FORMULARIOS ===== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #aaa;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 15px;
            color: #fff;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-group input[type="date"] {
            color-scheme: dark;
        }

        .form-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }

        /* ===== BOTONES ===== */
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a0a;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #ffe44d, #ffb700);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.25);
        }

        .btn-success {
            background: linear-gradient(135deg, #00c853, #00a844);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #00e676, #00c853);
            box-shadow: 0 10px 40px rgba(0, 200, 80, 0.25);
        }

        .btn-danger {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            box-shadow: 0 10px 40px rgba(211, 47, 47, 0.25);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f57c00, #e65100);
            color: white;
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            box-shadow: 0 10px 40px rgba(245, 124, 0, 0.25);
        }

        .btn-info {
            background: linear-gradient(135deg, #0288d1, #01579b);
            color: white;
        }

        .btn-info:hover {
            background: linear-gradient(135deg, #039be5, #0288d1);
            box-shadow: 0 10px 40px rgba(2, 136, 209, 0.25);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 11px;
        }

        .btn-xs {
            padding: 4px 10px;
            font-size: 10px;
        }

        /* ===== TABLA ===== */
        .table-wrapper {
            overflow-x: auto;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            padding: 12px 10px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.1);
        }

        td {
            padding: 10px 10px;
            color: #ccc;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* ===== ESTADÍSTICAS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .stats-card:hover {
            border-color: rgba(255, 215, 0, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        .stats-card .number {
            font-size: 30px;
            font-weight: 900;
            color: #ffd700;
        }

        .stats-card .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .stats-card.green .number { color: #4caf50; }
        .stats-card.orange .number { color: #ff9800; }
        .stats-card.purple .number { color: #ce93d8; }
        .stats-card.blue .number { color: #64b5f6; }

        /* ===== REGISTROS POR DÍA ===== */
        .dia-group {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .dia-header {
            background: rgba(255, 215, 0, 0.05);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dia-header:hover {
            background: rgba(255, 215, 0, 0.08);
        }

        .dia-header .fecha {
            color: #ffd700;
            font-weight: 700;
            font-size: 15px;
        }

        .dia-header .total-dia {
            color: #888;
            font-size: 13px;
        }

        .dia-header .total-dia span {
            color: #ffd700;
            font-weight: 700;
        }

        .dia-body {
            padding: 10px 18px;
        }

        .registro-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
        }

        .registro-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 215, 0, 0.08);
        }

        .registro-item .info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .registro-item .info .auto {
            color: #fff;
            font-weight: 600;
        }

        .registro-item .info .detalle {
            color: #888;
            font-size: 13px;
        }

        .registro-item .info .monto {
            color: #ffd700;
            font-weight: 600;
        }

        .registro-item .acciones {
            display: flex;
            gap: 5px;
        }

        .badge-auto {
            background: rgba(255, 215, 0, 0.12);
            color: #ffd700;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        /* ===== MENSAJES ===== */
        .mensaje {
            padding: 12px 20px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: 500;
            font-size: 14px;
        }

        .mensaje-exito {
            background: rgba(0, 200, 80, 0.1);
            color: #69f0ae;
            border-left: 4px solid #00c853;
        }

        .mensaje-error {
            background: rgba(211, 47, 47, 0.1);
            color: #ef9a9a;
            border-left: 4px solid #d32f2f;
        }

        .mensaje-info {
            background: rgba(2, 136, 209, 0.1);
            color: #81d4fa;
            border-left: 4px solid #0288d1;
        }

        /* ===== FOOTER ===== */
        .footer-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid rgba(255, 255, 255, 0.05);
        }

        .hidden {
            display: none !important;
        }

        /* ===== SCROLL ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #f0a500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2em;
            }
            .main-card {
                padding: 20px;
            }
            .section {
                padding: 18px;
            }
            .registro-item {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
            .registro-item .info {
                flex-direction: column;
                gap: 5px;
            }
            .registro-item .acciones {
                justify-content: flex-end;
            }
            .dia-header {
                flex-direction: column;
                gap: 5px;
                text-align: center;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media print {
            .btn, .footer-actions {
                display: none !important;
            }
            .main-card {
                background: white !important;
                padding: 10px !important;
            }
            body {
                background: white !important;
                padding: 10px !important;
            }
            .header h1 { color: #000 !important; }
            .section { border-color: #ccc !important; }
            th { background: #333 !important; color: white !important; }
            td { color: #333 !important; }
            .stats-card .number { color: #000 !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">

            <!-- ===== HEADER ===== -->
            <div class="header">
                <span class="logo-icon">✨</span>
                <h1>CAPITOL SHINE</h1>
                <p class="subtitle">Detailing &amp; Auto Spa · <span>Registro de Trabajo</span></p>
            </div>

            <!-- ===== CONFIGURACIÓN ===== -->
            <div id="configSection" class="section">
                <h2>⚙️ Iniciar Jornada</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>👤 Nombre del Empleado</label>
                        <input type="text" id="empleadoNombre" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label>📅 Fecha de Inicio (MM/DD/YYYY)</label>
                        <input type="date" id="fechaInicio" required>
                    </div>
                    <div class="form-group">
                        <label>📅 Fecha de Fin (MM/DD/YYYY)</label>
                        <input type="date" id="fechaFin" required>
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <button class="btn btn-gold" onclick="iniciarJornada()">🚀 Iniciar Jornada</button>
                    </div>
                </div>
            </div>

            <!-- ===== REGISTRO DE AUTO ===== -->
            <div id="registroSection" class="section hidden">
                <h2>🚗 Registrar Auto <span class="badge">Nuevo registro</span></h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>📅 Fecha (MM/DD/YYYY)</label>
                        <input type="date" id="fechaRegistro" required>
                    </div>
                    <div class="form-group">
                        <label>🕐 Hora Entrada</label>
                        <input type="time" id="horaEntrada" required>
                    </div>
                    <div class="form-group">
                        <label>🕐 Hora Salida</label>
                        <input type="time" id="horaSalida" required>
                    </div>
                    <div class="form-group">
                        <label>🚗 Auto</label>
                        <input type="text" id="auto" placeholder="Ej: Toyota Corolla 2020">
                    </div>
                    <div class="form-group">
                        <label>🔧 Servicio</label>
                        <input type="text" id="servicio" placeholder="Ej: Detailing completo">
                    </div>
                    <div class="form-group">
                        <label>💰 Cobro ($)</label>
                        <input type="number" id="cobro" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>💵 Propina ($)</label>
                        <input type="number" id="propina" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <button class="btn btn-success" onclick="agregarAuto()">➕ Agregar Auto</button>
                    </div>
                </div>
                <div id="mensajeRegistro" style="margin-top: 10px;"></div>
            </div>

            <!-- ===== LISTA DE REGISTROS ===== -->
            <div id="listaSection" class="section hidden">
                <h2>📊 Registros de la Jornada <span class="badge" id="totalAutosBadge">0 autos</span></h2>
                
                <div class="stats-grid" id="statsGrid">
                    <div class="stats-card blue">
                        <div class="number" id="totalAutos">0</div>
                        <div class="label">Total Autos</div>
                    </div>
                    <div class="stats-card purple">
                        <div class="number" id="totalHoras">0h</div>
                        <div class="label">Total Horas</div>
                    </div>
                    <div class="stats-card green">
                        <div class="number" id="totalCobros">$0</div>
                        <div class="label">Total Cobros</div>
                    </div>
                    <div class="stats-card orange">
                        <div class="number" id="totalPropinas">$0</div>
                        <div class="label">Total Propinas</div>
                    </div>
                </div>

                <div id="registrosList"></div>

                <div class="footer-actions">
                    <button class="btn btn-gold" onclick="exportarExcel()">📊 Exportar a Excel</button>
                    <button class="btn btn-info" onclick="window.print()">📄 Imprimir</button>
                    <button class="btn btn-warning" onclick="limpiarTodo()">🗑️ Limpiar Todo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ VARIABLES GLOBALES ============
        let registros = [];
        let empleadoActual = '';
        let fechaInicio = '';
        let fechaFin = '';

        // ============ INICIALIZAR FECHAS ============
        function inicializarFechas() {
            const hoy = new Date();
            const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);

            document.getElementById('fechaInicio').value = formatDateInput(primerDia);
            document.getElementById('fechaFin').value = formatDateInput(ultimoDia);
            document.getElementById('fechaRegistro').value = formatDateInput(hoy);
        }

        function formatDateInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const month = parts[1];
            const day = parts[2];
            const year = parts[0];
            return `${month}/${day}/${year}`;
        }

        function formatDateInputFromDisplay(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('/');
            if (parts.length !== 3) return dateStr;
            const month = parts[0].padStart(2, '0');
            const day = parts[1].padStart(2, '0');
            const year = parts[2];
            return `${year}-${month}-${day}`;
        }

        function parseDateInput(dateStr) {
            const parts = dateStr.split('-');
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }

        // ============ INICIAR JORNADA ============
        function iniciarJornada() {
            const nombre = document.getElementById('empleadoNombre').value.trim();
            const inicio = document.getElementById('fechaInicio').value;
            const fin = document.getElementById('fechaFin').value;

            if (!nombre) {
                mostrarMensaje('configSection', '⚠️ Ingresa tu nombre.', 'error');
                return;
            }

            if (!inicio || !fin) {
                mostrarMensaje('configSection', '⚠️ Selecciona las fechas.', 'error');
                return;
            }

            const fechaInicioObj = parseDateInput(inicio);
            const fechaFinObj = parseDateInput(fin);

            if (fechaInicioObj > fechaFinObj) {
                mostrarMensaje('configSection', '⚠️ La fecha de inicio debe ser menor o igual a la fecha de fin.', 'error');
                return;
            }

            empleadoActual = nombre;
            fechaInicio = inicio;
            fechaFin = fin;
            registros = [];

            document.getElementById('configSection').classList.add('hidden');
            document.getElementById('registroSection').classList.remove('hidden');
            document.getElementById('listaSection').classList.remove('hidden');

            // Actualizar fecha de registro por defecto
            const hoy = new Date();
            document.getElementById('fechaRegistro').value = formatDateInput(hoy);

            mostrarMensaje('configSection', `✅ Jornada iniciada para ${nombre}`, 'exito');
            actualizarLista();
        }

        // ============ AGREGAR AUTO ============
        function agregarAuto() {
            const fecha = document.getElementById('fechaRegistro').value;
            const horaEntrada = document.getElementById('horaEntrada').value;
            const horaSalida = document.getElementById('horaSalida').value;
            const auto = document.getElementById('auto').value.trim() || 'No especificado';
            const servicio = document.getElementById('servicio').value.trim() || 'No especificado';
            const cobro = parseFloat(document.getElementById('cobro').value) || 0;
            const propina = parseFloat(document.getElementById('propina').value) || 0;

            if (!fecha) {
                mostrarMensaje('registroSection', '⚠️ Selecciona una fecha.', 'error');
                return;
            }

            if (!horaEntrada || !horaSalida) {
                mostrarMensaje('registroSection', '⚠️ Ingresa hora de entrada y salida.', 'error');
                return;
            }

            // Validar que la fecha esté dentro del rango
            const fechaObj = parseDateInput(fecha);
            const inicioObj = parseDateInput(fechaInicio);
            const finObj = parseDateInput(fechaFin);

            if (fechaObj < inicioObj || fechaObj > finObj) {
                mostrarMensaje('registroSection', `⚠️ La fecha debe estar entre ${formatDateDisplay(fechaInicio)} y ${formatDateDisplay(fechaFin)}`, 'error');
                return;
            }

            // Calcular horas
            const horas = calcularHoras(horaEntrada, horaSalida);

            const registro = {
                fecha: fecha,
                horaEntrada: horaEntrada,
                horaSalida: horaSalida,
                horas: horas,
                auto: auto,
                servicio: servicio,
                cobro: cobro,
                propina: propina
            };

            registros.push(registro);
            actualizarLista();

            // Limpiar campos (excepto fecha)
            document.getElementById('horaEntrada').value = '';
            document.getElementById('horaSalida').value = '';
            document.getElementById('auto').value = '';
            document.getElementById('servicio').value = '';
            document.getElementById('cobro').value = '';
            document.getElementById('propina').value = '';

            // Mantener la misma fecha para seguir agregando autos del mismo día
            document.getElementById('fechaRegistro').value = fecha;

            mostrarMensaje('registroSection', `✅ Auto "${auto}" registrado correctamente.`, 'exito');
        }

        // ============ ELIMINAR AUTO ============
        function eliminarAuto(index) {
            if (confirm('¿Eliminar este registro?')) {
                registros.splice(index, 1);
                actualizarLista();
                mostrarMensaje('listaSection', '🗑️ Registro eliminado.', 'info');
            }
        }

        // ============ LIMPIAR TODO ============
        function limpiarTodo() {
            if (confirm('⚠️ ¿Borrar TODOS los registros?')) {
                registros = [];
                actualizarLista();
                mostrarMensaje('listaSection', '🗑️ Todos los registros han sido eliminados.', 'info');
            }
        }

        // ============ ACTUALIZAR LISTA ============
        function actualizarLista() {
            const container = document.getElementById('registrosList');

            if (registros.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#555; padding:30px;">No hay autos registrados aún.<br>¡Comienza a registrar tu trabajo!</p>';
                actualizarEstadisticas();
                return;
            }

            // Agrupar por fecha
            const grupos = {};
            registros.forEach((r, i) => {
                const fechaKey = r.fecha;
                if (!grupos[fechaKey]) {
                    grupos[fechaKey] = [];
                }
                grupos[fechaKey].push({ ...r, index: i });
            });

            // Ordenar fechas
            const fechasOrdenadas = Object.keys(grupos).sort();

            let html = '';
            fechasOrdenadas.forEach(fechaKey => {
                const items = grupos[fechaKey];
                const totalDia = items.length;
                const totalCobroDia = items.reduce((sum, r) => sum + r.cobro, 0);
                const totalPropinaDia = items.reduce((sum, r) => sum + r.propina, 0);

                html += `
                    <div class="dia-group">
                        <div class="dia-header">
                            <span class="fecha">📅 ${formatDateDisplay(fechaKey)}</span>
                            <span class="total-dia">
                                ${totalDia} auto${totalDia > 1 ? 's' : ''} · 
                                Cobro: <span>$${totalCobroDia.toFixed(2)}</span> · 
                                Propina: <span>$${totalPropinaDia.toFixed(2)}</span>
                            </span>
                        </div>
                        <div class="dia-body">
                `;

                items.forEach((r) => {
                    const horasFormateadas = formatearHoras(r.horas);
                    html += `
                        <div class="registro-item">
                            <div class="info">
                                <span class="auto">🚗 ${r.auto}</span>
                                <span class="detalle">⏱ ${r.horaEntrada} - ${r.horaSalida} · ${horasFormateadas}</span>
                                <span class="detalle">🔧 ${r.servicio}</span>
                                <span class="monto">💰 $${r.cobro.toFixed(2)}</span>
                                <span class="monto" style="color:#ff9800;">💵 $${r.propina.toFixed(2)}</span>
                            </div>
                            <div class="acciones">
                                <button class="btn btn-danger btn-xs" onclick="eliminarAuto(${r.index})">🗑️</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            actualizarEstadisticas();

            // Actualizar badge
            document.getElementById('totalAutosBadge').textContent = `${registros.length} auto${registros.length > 1 ? 's' : ''}`;
        }

        // ============ ESTADÍSTICAS ============
        function actualizarEstadisticas() {
            document.getElementById('totalAutos').textContent = registros.length;

            const totalHoras = registros.reduce((sum, r) => sum + r.horas, 0);
            document.getElementById('totalHoras').textContent = formatearHoras(totalHoras);

            const totalCobro = registros.reduce((sum, r) => sum + r.cobro, 0);
            document.getElementById('totalCobros').textContent = `$${totalCobro.toFixed(2)}`;

            const totalPropina = registros.reduce((sum, r) => sum + r.propina, 0);
            document.getElementById('totalPropinas').textContent = `$${totalPropina.toFixed(2)}`;
        }

        // ============ EXPORTAR A EXCEL ============
        function exportarExcel() {
            if (registros.length === 0) {
                alert('⚠️ No hay registros para exportar.');
                return;
            }

            const headers = ['#', 'Fecha', 'Hora Entrada', 'Hora Salida', 'Horas', 'Auto', 'Servicio', 'Cobro', 'Propina'];
            let csv = headers.join(',') + '\n';

            registros.forEach((r, i) => {
                const row = [
                    i + 1,
                    formatDateDisplay(r.fecha),
                    r.horaEntrada,
                    r.horaSalida,
                    r.horas.toFixed(2).replace('.', ','),
                    `"${r.auto}"`,
                    `"${r.servicio}"`,
                    r.cobro.toFixed(2).replace('.', ','),
                    r.propina.toFixed(2).replace('.', ',')
                ];
                csv += row.join(',') + '\n';
            });

            // Totales
            const totalHoras = registros.reduce((sum, r) => sum + r.horas, 0);
            const totalCobro = registros.reduce((sum, r) => sum + r.cobro, 0);
            const totalPropina = registros.reduce((sum, r) => sum + r.propina, 0);

            csv += '\nTOTALES,,,,,' + totalHoras.toFixed(2).replace('.', ',') + ',,' + totalCobro.toFixed(2).replace('.', ',') + ',' + totalPropina.toFixed(2).replace('.', ',');

            // Info del empleado
            csv += `\n\nEmpleado: ${empleadoActual}`;
            csv += `\nPeríodo: ${formatDateDisplay(fechaInicio)} - ${formatDateDisplay(fechaFin)}`;
            csv += `\nCapitol Shine - Detailing & Auto Spa`;

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `CapitolShine_${empleadoActual}_${formatDateDisplay(fechaInicio)}_${formatDateDisplay(fechaFin)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ============ CÁLCULO DE HORAS ============
        function calcularHoras(entrada, salida) {
            const [h1, m1] = entrada.split(':').map(Number);
            const [h2, m2] = salida.split(':').map(Number);
            let horas = h2 - h1;
            let minutos = m2 - m1;
            if (minutos < 0) {
                horas--;
                minutos += 60;
            }
            if (horas < 0) horas += 24;
            return horas + (minutos / 60);
        }

        function formatearHoras(horas) {
            if (!horas || horas === 0) return '0h';
            const h = Math.floor(horas);
            const m = Math.round((horas - h) * 60);
            if (m === 0) return `${h}h`;
            return `${h}h ${m}min`;
        }

        // ============ MENSAJES ============
        function mostrarMensaje(sectionId, mensaje, tipo) {
            const section = document.getElementById(sectionId);
            const existing = section.querySelector('.mensaje');
            if (existing) existing.remove();

            const div = document.createElement('div');
            div.className = `mensaje mensaje-${tipo}`;
            div.textContent = mensaje;
            section.appendChild(div);

            setTimeout(() => {
                if (div.parentNode) div.remove();
            }, 5000);
        }

        // ============ INICIALIZAR ============
        inicializarFechas();

        console.log('✨ Capitol Shine - Sistema de Registro cargado');
        console.log('🚗 Formato de fecha: MM/DD/YYYY (Estilo EE.UU.)');
        console.log('📅 Fecha actual: ' + formatDateDisplay(document.getElementById('fechaRegistro').value));
    </script>
</body>
</html>
