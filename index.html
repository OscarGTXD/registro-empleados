<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Temporal de Jornada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            font-size: 60px;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2em;
            margin-top: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1em;
        }

        .section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #2c3e50;
            font-size: 1.2em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #34495e;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input[type="text"] {
            text-transform: uppercase;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-info {
            background: #3498db;
            color: white;
        }

        .btn-info:hover {
            background: #2980b9;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .table-wrapper {
            overflow-x: auto;
            margin: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 10px 8px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 8px 8px;
            border-bottom: 1px solid #e0e6ed;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stats-card .number {
            font-size: 28px;
            font-weight: 700;
        }

        .stats-card .label {
            font-size: 12px;
            opacity: 0.9;
        }

        .stats-card.green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .stats-card.orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stats-card.purple {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .registro-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e0e6ed;
        }

        .registro-item .info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .registro-item .info span {
            font-size: 13px;
        }

        .registro-item .info .fecha {
            font-weight: 600;
            color: #2c3e50;
        }

        .registro-item .acciones {
            display: flex;
            gap: 5px;
        }

        .hidden {
            display: none !important;
        }

        .mensaje {
            padding: 12px 20px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 500;
        }

        .mensaje-exito {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .mensaje-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .mensaje-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .footer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e6ed;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .registro-item {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
            .registro-item .info {
                flex-direction: column;
                gap: 5px;
            }
            .registro-item .acciones {
                justify-content: flex-end;
            }
            h1 {
                font-size: 1.6em;
            }
        }

        @media print {
            .btn, .actions-bar, .footer-actions {
                display: none !important;
            }
            .main-card {
                box-shadow: none !important;
                padding: 10px !important;
            }
            body {
                background: white !important;
                padding: 10px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="header">
                <div class="icon">📋</div>
                <h1>Registro de Jornada</h1>
                <p class="subtitle">Sistema temporal • Exporta tus datos al finalizar</p>
            </div>

            <!-- ==================== CONFIGURACIÓN INICIAL ==================== -->
            <div id="configSection" class="section">
                <h2>⚙️ Configurar Quincena</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>👤 Nombre del Empleado</label>
                        <input type="text" id="empleadoNombre" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label>📅 Fecha Inicio (DD/MM/YYYY)</label>
                        <input type="text" id="fechaInicio" placeholder="Ej: 01/07/2026" required>
                    </div>
                    <div class="form-group">
                        <label>📅 Fecha Fin (DD/MM/YYYY)</label>
                        <input type="text" id="fechaFin" placeholder="Ej: 15/07/2026" required>
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <button class="btn btn-success" onclick="iniciarQuincena()">✅ Iniciar Quincena</button>
                    </div>
                </div>
            </div>

            <!-- ==================== REGISTRO DIARIO ==================== -->
            <div id="registroSection" class="section hidden">
                <h2>📝 Registrar Día</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>📅 Fecha (DD/MM/YYYY)</label>
                        <input type="text" id="fechaRegistro" placeholder="Ej: 01/07/2026" required>
                    </div>
                    <div class="form-group">
                        <label>🕐 Hora Entrada</label>
                        <input type="time" id="horaEntrada" required>
                    </div>
                    <div class="form-group">
                        <label>🕐 Hora Salida</label>
                        <input type="time" id="horaSalida" required>
                    </div>
                    <div class="form-group">
                        <label>🚗 Auto Atendido</label>
                        <input type="text" id="auto" placeholder="Ej: Toyota Corolla">
                    </div>
                    <div class="form-group">
                        <label>🔧 Servicio</label>
                        <input type="text" id="servicio" placeholder="Ej: Cambio de aceite">
                    </div>
                    <div class="form-group">
                        <label>💰 Cobro ($)</label>
                        <input type="number" id="cobro" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>💵 Propina ($)</label>
                        <input type="number" id="propina" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <button class="btn btn-primary" onclick="agregarRegistro()">➕ Agregar Registro</button>
                    </div>
                </div>

                <div id="mensajeRegistro" style="margin-top: 10px;"></div>
            </div>

            <!-- ==================== LISTA DE REGISTROS ==================== -->
            <div id="listaSection" class="section hidden">
                <h2>📊 Registros de la Quincena</h2>
                
                <div class="stats-grid" id="statsGrid">
                    <div class="stats-card blue">
                        <div class="number" id="totalRegistros">0</div>
                        <div class="label">Total Registros</div>
                    </div>
                    <div class="stats-card purple">
                        <div class="number" id="totalHoras">0h</div>
                        <div class="label">Total Horas</div>
                    </div>
                    <div class="stats-card green">
                        <div class="number" id="totalCobros">$0</div>
                        <div class="label">Total Cobros</div>
                    </div>
                    <div class="stats-card orange">
                        <div class="number" id="totalPropinas">$0</div>
                        <div class="label">Total Propinas</div>
                    </div>
                </div>

                <div id="registrosList"></div>

                <div class="footer-actions">
                    <button class="btn btn-success" onclick="exportarExcel()">📊 Exportar a Excel</button>
                    <button class="btn btn-info" onclick="exportarPDF()">📄 Exportar a PDF</button>
                    <button class="btn btn-warning" onclick="imprimir()">🖨️ Imprimir</button>
                    <button class="btn btn-danger" onclick="limpiarTodo()">🗑️ Limpiar Todo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ VARIABLES GLOBALES ============
        let registros = [];
        let empleadoActual = '';
        let fechaInicio = '';
        let fechaFin = '';

        // ============ FUNCIONES PRINCIPALES ============
        function iniciarQuincena() {
            const nombre = document.getElementById('empleadoNombre').value.trim();
            const inicio = document.getElementById('fechaInicio').value.trim();
            const fin = document.getElementById('fechaFin').value.trim();

            if (!nombre) {
                mostrarMensaje('configSection', '⚠️ Por favor, ingresa tu nombre.', 'error');
                return;
            }

            if (!validarFecha(inicio)) {
                mostrarMensaje('configSection', '⚠️ Fecha de inicio inválida. Usa DD/MM/YYYY', 'error');
                return;
            }

            if (!validarFecha(fin)) {
                mostrarMensaje('configSection', '⚠️ Fecha de fin inválida. Usa DD/MM/YYYY', 'error');
                return;
            }

            if (!compararFechas(inicio, fin)) {
                mostrarMensaje('configSection', '⚠️ La fecha de inicio debe ser menor o igual a la fecha de fin.', 'error');
                return;
            }

            empleadoActual = nombre;
            fechaInicio = inicio;
            fechaFin = fin;
            registros = [];

            document.getElementById('configSection').classList.add('hidden');
            document.getElementById('registroSection').classList.remove('hidden');
            document.getElementById('listaSection').classList.remove('hidden');

            // Sugerir fecha actual como fecha de registro
            const hoy = new Date();
            document.getElementById('fechaRegistro').value = formatearFechaDMY(hoy);

            mostrarMensaje('configSection', `✅ Quincena iniciada para ${nombre} del ${inicio} al ${fin}`, 'exito');
            actualizarLista();
        }

        function agregarRegistro() {
            const fecha = document.getElementById('fechaRegistro').value.trim();
            const horaEntrada = document.getElementById('horaEntrada').value;
            const horaSalida = document.getElementById('horaSalida').value;
            const auto = document.getElementById('auto').value.trim();
            const servicio = document.getElementById('servicio').value.trim();
            const cobro = parseFloat(document.getElementById('cobro').value) || 0;
            const propina = parseFloat(document.getElementById('propina').value) || 0;

            if (!fecha) {
                mostrarMensaje('registroSection', '⚠️ Ingresa una fecha.', 'error');
                return;
            }

            if (!validarFecha(fecha)) {
                mostrarMensaje('registroSection', '⚠️ Fecha inválida. Usa DD/MM/YYYY', 'error');
                return;
            }

            if (!compararFechas(fechaInicio, fecha) || !compararFechas(fecha, fechaFin)) {
                mostrarMensaje('registroSection', `⚠️ La fecha debe estar entre ${fechaInicio} y ${fechaFin}`, 'error');
                return;
            }

            if (!horaEntrada || !horaSalida) {
                mostrarMensaje('registroSection', '⚠️ Ingresa la hora de entrada y salida.', 'error');
                return;
            }

            // Calcular horas trabajadas
            const horas = calcularHoras(horaEntrada, horaSalida);

            const registro = {
                fecha: fecha,
                horaEntrada: horaEntrada,
                horaSalida: horaSalida,
                horas: horas,
                auto: auto || 'No especificado',
                servicio: servicio || 'No especificado',
                cobro: cobro,
                propina: propina
            };

            registros.push(registro);
            actualizarLista();

            // Limpiar campos
            document.getElementById('horaEntrada').value = '';
            document.getElementById('horaSalida').value = '';
            document.getElementById('auto').value = '';
            document.getElementById('servicio').value = '';
            document.getElementById('cobro').value = '';
            document.getElementById('propina').value = '';

            // Avanzar fecha
            const fechaActual = parseFechaDMY(fecha);
            fechaActual.setDate(fechaActual.getDate() + 1);
            document.getElementById('fechaRegistro').value = formatearFechaDMY(fechaActual);

            mostrarMensaje('registroSection', '✅ Registro guardado correctamente.', 'exito');
        }

        function eliminarRegistro(index) {
            if (confirm('¿Eliminar este registro?')) {
                registros.splice(index, 1);
                actualizarLista();
                mostrarMensaje('listaSection', '🗑️ Registro eliminado.', 'info');
            }
        }

        function limpiarTodo() {
            if (confirm('⚠️ ¿Borrar TODOS los registros? Esta acción no se puede deshacer.')) {
                registros = [];
                actualizarLista();
                mostrarMensaje('listaSection', '🗑️ Todos los registros han sido eliminados.', 'info');
            }
        }

        // ============ ACTUALIZAR LISTA ============
        function actualizarLista() {
            const container = document.getElementById('registrosList');
            
            if (registros.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#95a5a6; padding:20px;">No hay registros aún. Agrega tu primer día de trabajo.</p>';
                actualizarEstadisticas();
                return;
            }

            // Ordenar por fecha
            registros.sort((a, b) => {
                const fa = parseFechaDMY(a.fecha);
                const fb = parseFechaDMY(b.fecha);
                return fa - fb;
            });

            let html = '<div class="table-wrapper"><table><thead><tr>';
            html += '<th>#</th><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Auto</th><th>Servicio</th><th>Cobro</th><th>Propina</th><th>Acciones</th>';
            html += '</tr></thead><tbody>';

            registros.forEach((r, i) => {
                html += `<tr>
                    <td>${i + 1}</td>
                    <td><strong>${r.fecha}</strong></td>
                    <td>${r.horaEntrada}</td>
                    <td>${r.horaSalida}</td>
                    <td>${formatearHoras(r.horas)}</td>
                    <td>${r.auto}</td>
                    <td>${r.servicio}</td>
                    <td>$${r.cobro.toFixed(2)}</td>
                    <td>$${r.propina.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="eliminarRegistro(${i})">🗑️</button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
            actualizarEstadisticas();
        }

        // ============ ESTADÍSTICAS ============
        function actualizarEstadisticas() {
            document.getElementById('totalRegistros').textContent = registros.length;
            
            const totalHoras = registros.reduce((sum, r) => sum + r.horas, 0);
            document.getElementById('totalHoras').textContent = formatearHoras(totalHoras);
            
            const totalCobro = registros.reduce((sum, r) => sum + r.cobro, 0);
            document.getElementById('totalCobros').textContent = `$${totalCobro.toFixed(2)}`;
            
            const totalPropina = registros.reduce((sum, r) => sum + r.propina, 0);
            document.getElementById('totalPropinas').textContent = `$${totalPropina.toFixed(2)}`;
        }

        // ============ EXPORTAR A EXCEL ============
        function exportarExcel() {
            if (registros.length === 0) {
                alert('⚠️ No hay registros para exportar.');
                return;
            }

            const headers = ['#', 'Fecha', 'Entrada', 'Salida', 'Horas', 'Auto', 'Servicio', 'Cobro', 'Propina'];
            let csv = headers.join(',') + '\n';

            registros.forEach((r, i) => {
                const row = [
                    i + 1,
                    r.fecha,
                    r.horaEntrada,
                    r.horaSalida,
                    r.horas.toFixed(2).replace('.', ','),
                    `"${r.auto}"`,
                    `"${r.servicio}"`,
                    r.cobro.toFixed(2).replace('.', ','),
                    r.propina.toFixed(2).replace('.', ',')
                ];
                csv += row.join(',') + '\n';
            });

            // Agregar totales al final
            const totalHoras = registros.reduce((sum, r) => sum + r.horas, 0);
            const totalCobro = registros.reduce((sum, r) => sum + r.cobro, 0);
            const totalPropina = registros.reduce((sum, r) => sum + r.propina, 0);
            
            csv += '\nTOTALES,,,,' + totalHoras.toFixed(2).replace('.', ',') + ',,' + totalCobro.toFixed(2).replace('.', ',') + ',' + totalPropina.toFixed(2).replace('.', ',');

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `registro_${empleadoActual}_${fechaInicio}_${fechaFin}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ============ EXPORTAR A PDF (Imprimir) ============
        function exportarPDF() {
            if (registros.length === 0) {
                alert('⚠️ No hay registros para exportar.');
                return;
            }
            window.print();
        }

        function imprimir() {
            window.print();
        }

        // ============ FUNCIONES DE FECHA ============
        function validarFecha(fecha) {
            const regex = /^(\d{2})\/(\d{2})\/(\d{4})$/;
            if (!regex.test(fecha)) return false;
            
            const [, dia, mes, año] = fecha.match(regex);
            const d = parseInt(dia);
            const m = parseInt(mes);
            const a = parseInt(año);
            
            if (m < 1 || m > 12) return false;
            if (d < 1 || d > 31) return false;
            
            // Validar días por mes
            const diasMes = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            // Año bisiesto
            if (m === 2) {
                const esBisiesto = (a % 4 === 0 && a % 100 !== 0) || (a % 400 === 0);
                if (d > (esBisiesto ? 29 : 28)) return false;
            } else if (d > diasMes[m - 1]) {
                return false;
            }
            
            return true;
        }

        function parseFechaDMY(fecha) {
            const [dia, mes, año] = fecha.split('/').map(Number);
            return new Date(año, mes - 1, dia);
        }

        function formatearFechaDMY(fecha) {
            const dia = String(fecha.getDate()).padStart(2, '0');
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const año = fecha.getFullYear();
            return `${dia}/${mes}/${año}`;
        }

        function compararFechas(fecha1, fecha2) {
            const f1 = parseFechaDMY(fecha1);
            const f2 = parseFechaDMY(fecha2);
            return f1 <= f2;
        }

        // ============ CÁLCULO DE HORAS ============
        function calcularHoras(entrada, salida) {
            const [h1, m1] = entrada.split(':').map(Number);
            const [h2, m2] = salida.split(':').map(Number);
            let horas = h2 - h1;
            let minutos = m2 - m1;
            if (minutos < 0) {
                horas--;
                minutos += 60;
            }
            if (horas < 0) horas += 24;
            return horas + (minutos / 60);
        }

        function formatearHoras(horas) {
            if (!horas || horas === 0) return '0h';
            const h = Math.floor(horas);
            const m = Math.round((horas - h) * 60);
            if (m === 0) return `${h}h`;
            return `${h}h ${m}min`;
        }

        // ============ MENSAJES ============
        function mostrarMensaje(sectionId, mensaje, tipo) {
            const section = document.getElementById(sectionId);
            const existing = section.querySelector('.mensaje');
            if (existing) existing.remove();

            const div = document.createElement('div');
            div.className = `mensaje mensaje-${tipo}`;
            div.textContent = mensaje;
            section.appendChild(div);

            setTimeout(() => {
                if (div.parentNode) div.remove();
            }, 5000);
        }

        // ============ INICIALIZAR ============
        // Poner fecha actual por defecto
        const hoy = new Date();
        document.getElementById('fechaRegistro').value = formatearFechaDMY(hoy);
        
        // Fecha inicio por defecto: primer día del mes
        const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
        document.getElementById('fechaInicio').value = formatearFechaDMY(primerDia);
        
        // Fecha fin por defecto: día 15 del mes o último día
        const dia = hoy.getDate();
        let ultimoDia = 15;
        if (dia > 15) {
            const proximoMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
            ultimoDia = proximoMes.getDate();
        }
        const fechaFinDefault = new Date(hoy.getFullYear(), hoy.getMonth(), ultimoDia);
        document.getElementById('fechaFin').value = formatearFechaDMY(fechaFinDefault);

        console.log('📋 Sistema de Registro Temporal cargado.');
        console.log('💡 Fecha actual: ' + formatearFechaDMY(hoy));
        console.log('📅 Quincena sugerida: ' + document.getElementById('fechaInicio').value + ' al ' + document.getElementById('fechaFin').value);
    </script>
</body>
</html>
