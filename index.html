<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Capitol Shine - Registro de Detailing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            padding: 10px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(255, 200, 0, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 200, 0, 0.03) 0%, transparent 50%);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 5px;
        }

        .main-card {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 200, 0, 0.1);
            border: 1px solid rgba(255, 200, 0, 0.08);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 200, 0, 0.15);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .header .logo-icon {
            font-size: 40px;
            display: block;
        }

        .header h1 {
            color: #ffd700;
            font-size: 2em;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
            font-family: 'Arial Black', sans-serif;
        }

        .header .subtitle {
            color: #888;
            font-size: 0.85em;
            letter-spacing: 1px;
            margin-top: 3px;
        }

        .header .subtitle span {
            color: #ffd700;
        }

        .idioma-selector {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .idioma-selector button {
            padding: 6px 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 12px;
            color: #888;
            touch-action: manipulation;
        }

        .idioma-selector button:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
        }

        .idioma-selector button.active {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border-color: #ffd700;
        }

        /* ===== SECCIONES ===== */
        .section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .section h2 {
            color: #ffd700;
            font-size: 1.1em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            flex-wrap: wrap;
        }

        .section h2 .badge {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* ===== FORMULARIOS ===== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #aaa;
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            min-height: 44px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-group input[type="date"] {
            color-scheme: dark;
            min-height: 44px;
        }

        .form-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
            padding: 4px;
        }

        /* ===== BOTONES ===== */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            touch-action: manipulation;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a0a;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #ffe44d, #ffb700);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.25);
        }

        .btn-success {
            background: linear-gradient(135deg, #00c853, #00a844);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #00e676, #00c853);
            box-shadow: 0 10px 40px rgba(0, 200, 80, 0.25);
        }

        .btn-danger {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            box-shadow: 0 10px 40px rgba(211, 47, 47, 0.25);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f57c00, #e65100);
            color: white;
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #fb8c00, #f57c00);
            box-shadow: 0 10px 40px rgba(245, 124, 0, 0.25);
        }

        .btn-info {
            background: linear-gradient(135deg, #0288d1, #01579b);
            color: white;
        }

        .btn-info:hover {
            background: linear-gradient(135deg, #039be5, #0288d1);
            box-shadow: 0 10px 40px rgba(2, 136, 209, 0.25);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 11px;
            min-height: 32px;
            width: auto;
        }

        .btn-xs {
            padding: 4px 10px;
            font-size: 10px;
            min-height: 28px;
            width: auto;
        }

        /* ===== TABLA ===== */
        .table-wrapper {
            overflow-x: auto;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 600px;
        }

        th {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            padding: 10px 8px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.1);
            white-space: nowrap;
        }

        td {
            padding: 8px 8px;
            color: #ccc;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* ===== ESTADÍSTICAS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin: 12px 0;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .stats-card .number {
            font-size: 24px;
            font-weight: 900;
            color: #ffd700;
        }

        .stats-card .label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }

        .stats-card.green .number { color: #4caf50; }
        .stats-card.orange .number { color: #ff9800; }
        .stats-card.purple .number { color: #ce93d8; }
        .stats-card.blue .number { color: #64b5f6; }

        /* ===== REGISTROS POR DÍA ===== */
        .dia-group {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .dia-header {
            background: rgba(255, 215, 0, 0.05);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .dia-header:hover {
            background: rgba(255, 215, 0, 0.08);
        }

        .dia-header .fecha {
            color: #ffd700;
            font-weight: 700;
            font-size: 14px;
        }

        .dia-header .total-dia {
            color: #888;
            font-size: 12px;
        }

        .dia-header .total-dia span {
            color: #ffd700;
            font-weight: 700;
        }

        .dia-body {
            padding: 8px 14px;
        }

        .registro-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 5px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
            flex-wrap: wrap;
            gap: 8px;
        }

        .registro-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 215, 0, 0.08);
        }

        .registro-item .info {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }

        .registro-item .info .auto {
            color: #fff;
            font-weight: 600;
            font-size: 13px;
        }

        .registro-item .info .detalle {
            color: #888;
            font-size: 12px;
        }

        .registro-item .info .monto {
            color: #ffd700;
            font-weight: 600;
            font-size: 13px;
        }

        .registro-item .acciones {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .badge-auto {
            background: rgba(255, 215, 0, 0.12);
            color: #ffd700;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        /* ===== MENSAJES ===== */
        .mensaje {
            padding: 10px 16px;
            border-radius: 10px;
            margin: 8px 0;
            font-weight: 500;
            font-size: 13px;
        }

        .mensaje-exito {
            background: rgba(0, 200, 80, 0.1);
            color: #69f0ae;
            border-left: 4px solid #00c853;
        }

        .mensaje-error {
            background: rgba(211, 47, 47, 0.1);
            color: #ef9a9a;
            border-left: 4px solid #d32f2f;
        }

        .mensaje-info {
            background: rgba(2, 136, 209, 0.1);
            color: #81d4fa;
            border-left: 4px solid #0288d1;
        }

        /* ===== FOOTER ===== */
        .footer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.05);
        }

        .footer-actions .btn {
            flex: 1;
            min-width: 120px;
            max-width: 200px;
        }

        .hidden {
            display: none !important;
        }

        /* ===== SCROLL ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #f0a500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .main-card {
                padding: 16px;
            }
            .form-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 10px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            
            .main-card {
                padding: 14px;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 1.6em;
                letter-spacing: 2px;
            }

            .header .logo-icon {
                font-size: 32px;
            }

            .header .subtitle {
                font-size: 0.75em;
            }

            .header-top {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .section {
                padding: 14px;
                margin-bottom: 14px;
            }

            .section h2 {
                font-size: 1em;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .form-group input,
            .form-group select {
                font-size: 16px;
                padding: 12px 14px;
                min-height: 48px;
            }

            .btn {
                font-size: 14px;
                padding: 14px 20px;
                min-height: 48px;
                width: 100%;
            }

            .btn-sm {
                font-size: 11px;
                padding: 6px 12px;
                min-height: 34px;
                width: auto;
            }

            .btn-xs {
                font-size: 10px;
                padding: 4px 10px;
                min-height: 30px;
                width: auto;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .stats-card {
                padding: 10px;
            }

            .stats-card .number {
                font-size: 20px;
            }

            .stats-card .label {
                font-size: 9px;
            }

            .dia-header {
                flex-direction: column;
                gap: 4px;
                text-align: center;
                padding: 10px;
            }

            .dia-header .fecha {
                font-size: 13px;
            }

            .dia-header .total-dia {
                font-size: 11px;
            }

            .registro-item {
                flex-direction: column;
                gap: 6px;
                align-items: stretch;
                padding: 8px 10px;
            }

            .registro-item .info {
                flex-direction: column;
                gap: 4px;
                align-items: flex-start;
            }

            .registro-item .info .auto {
                font-size: 14px;
            }

            .registro-item .info .detalle {
                font-size: 12px;
            }

            .registro-item .info .monto {
                font-size: 13px;
            }

            .registro-item .acciones {
                justify-content: flex-end;
                margin-top: 4px;
            }

            .footer-actions {
                gap: 8px;
            }

            .footer-actions .btn {
                min-width: 100%;
                max-width: 100%;
                flex: 1 1 100%;
            }

            table {
                font-size: 11px;
                min-width: 500px;
            }

            th {
                font-size: 9px;
                padding: 8px 6px;
            }

            td {
                font-size: 11px;
                padding: 6px 6px;
            }

            .mensaje {
                font-size: 12px;
                padding: 8px 14px;
            }
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 10px;
            }
            .header h1 {
                font-size: 1.4em;
            }
            .section {
                padding: 10px;
            }
            .form-group input,
            .form-group select {
                font-size: 16px;
                padding: 10px 12px;
                min-height: 44px;
            }
            .btn {
                font-size: 13px;
                padding: 12px 16px;
                min-height: 44px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            .stats-card {
                padding: 8px;
            }
            .stats-card .number {
                font-size: 18px;
            }
            .dia-body {
                padding: 6px 8px;
            }
            .registro-item {
                padding: 6px 8px;
            }
        }

        /* ===== IMPRESIÓN ===== */
        @media print {
            .btn, .footer-actions, .idioma-selector {
                display: none !important;
            }
            .main-card {
                background: white !important;
                padding: 10px !important;
                box-shadow: none !important;
                border: 1px solid #ccc !important;
            }
            body {
                background: white !important;
                padding: 10px !important;
            }
            .header h1 { color: #000 !important; }
            .section { border-color: #ccc !important; background: #f9f9f9 !important; }
            th { background: #333 !important; color: white !important; }
            td { color: #333 !important; }
            .stats-card .number { color: #000 !important; }
            .stats-card { border: 1px solid #ccc !important; background: #f5f5f5 !important; }
            .dia-header { background: #eee !important; }
            .dia-header .fecha { color: #000 !important; }
            .registro-item { border-color: #ddd !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">

            <!-- ===== HEADER ===== -->
            <div class="header">
                <div class="header-top">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="logo-icon">✨</span>
                        <div style="text-align:left;">
                            <h1 style="font-size:1.6em;">CAPITOL SHINE</h1>
                            <p class="subtitle" style="font-size:0.7em;">Detailing &amp; Auto Spa · <span id="headerSubtitle">Registro de Trabajo</span></p>
                        </div>
                    </div>
                    <div class="idioma-selector">
                        <button class="active" onclick="cambiarIdioma('es')" id="btnEs">🇪🇸 ES</button>
                        <button onclick="cambiarIdioma('en')" id="btnEn">🇬🇧 EN</button>
                    </div>
                </div>
            </div>

            <!-- ===== CONFIGURACIÓN ===== -->
            <div id="configSection" class="section">
                <h2 id="lblConfigTitle">⚙️ Iniciar Jornada</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label id="lblEmployeeName">👤 Nombre del Empleado</label>
                        <input type="text" id="empleadoNombre" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <button class="btn btn-gold" onclick="iniciarJornada()" id="btnStart">🚀 Iniciar Jornada</button>
                    </div>
                </div>
                <div id="mensajeConfig" style="margin-top:10px;"></div>
            </div>

            <!-- ===== REGISTRO DE AUTO ===== -->
            <div id="registroSection" class="section hidden">
                <h2 id="lblRegisterTitle">🚗 Registrar Auto <span class="badge" id="lblNewRecord">Nuevo registro</span></h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label id="lblDate">📅 Fecha</label>
                        <input type="date" id="fechaRegistro" required>
                    </div>
                    <div class="form-group">
                        <label id="lblEntryTime">🕐 Hora Entrada</label>
                        <input type="time" id="horaEntrada" required>
                    </div>
                    <div class="form-group">
                        <label id="lblExitTime">🕐 Hora Salida</label>
                        <input type="time" id="horaSalida" required>
                    </div>
                    <div class="form-group">
                        <label id="lblVehicle">🚗 Auto</label>
                        <input type="text" id="auto" placeholder="Ej: Toyota Corolla 2020">
                    </div>
                    <div class="form-group">
                        <label id="lblService">🔧 Servicio</label>
                        <input type="text" id="servicio" placeholder="Ej: Detailing completo">
                    </div>
                    <div class="form-group">
                        <label id="lblCharge">💰 Cobro ($)</label>
                        <input type="number" id="cobro" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group">
                        <label id="lblTip">💵 Propina ($)</label>
                        <input type="number" id="propina" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <button class="btn btn-success" onclick="agregarAuto()" id="btnAddVehicle">➕ Agregar Auto</button>
                    </div>
                </div>
                <div id="mensajeRegistro" style="margin-top: 10px;"></div>
            </div>

            <!-- ===== LISTA DE REGISTROS ===== -->
            <div id="listaSection" class="section hidden">
                <h2 id="lblListTitle">📊 Registros de la Jornada <span class="badge" id="totalAutosBadge">0 autos</span></h2>
                
                <div class="stats-grid" id="statsGrid">
                    <div class="stats-card blue">
                        <div class="number" id="totalAutos">0</div>
                        <div class="label" id="lblTotalVehicles">Total Autos</div>
                    </div>
                    <div class="stats-card purple">
                        <div class="number" id="totalHoras">0h</div>
                        <div class="label" id="lblTotalHours">Total Horas</div>
                    </div>
                    <div class="stats-card green">
                        <div class="number" id="totalCobros">$0</div>
                        <div class="label" id="lblTotalCharges">Total Cobros</div>
                    </div>
                    <div class="stats-card orange">
                        <div class="number" id="totalPropinas">$0</div>
                        <div class="label" id="lblTotalTips">Total Propinas</div>
                    </div>
                </div>

                <div id="registrosList"></div>

                <div class="footer-actions">
                    <button class="btn btn-gold" onclick="exportarExcel()" id="btnExportExcel">📊 Exportar a Excel</button>
                    <button class="btn btn-info" onclick="window.print()" id="btnPrint">📄 Imprimir</button>
                    <button class="btn btn-warning" onclick="limpiarTodo()" id="btnClearAll">🗑️ Limpiar Todo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ IDIOMAS ============
        const textos = {
            es: {
                subtitle: 'Registro de Trabajo',
                configTitle: '⚙️ Iniciar Jornada',
                employeeName: '👤 Nombre del Empleado',
                start: '🚀 Iniciar Jornada',
                registerTitle: '🚗 Registrar Auto',
                newRecord: 'Nuevo registro',
                date: '📅 Fecha',
                entryTime: '🕐 Hora Entrada',
                exitTime: '🕐 Hora Salida',
                vehicle: '🚗 Auto',
                service: '🔧 Servicio',
                charge: '💰 Cobro ($)',
                tip: '💵 Propina ($)',
                addVehicle: '➕ Agregar Auto',
                listTitle: '📊 Registros de la Jornada',
                totalVehicles: 'Total Autos',
                totalHours: 'Total Horas',
                totalCharges: 'Total Cobros',
                totalTips: 'Total Propinas',
                exportExcel: '📊 Exportar a Excel',
                print: '📄 Imprimir',
                clearAll: '🗑️ Limpiar Todo',
                startSuccess: '✅ Jornada iniciada para ',
                startError: '⚠️ Ingresa tu nombre.',
                recordSuccess: '✅ Auto "',
                recordError: '⚠️ Ingresa hora de entrada y salida.',
                deleteConfirm: '¿Eliminar este registro?',
                clearConfirm: '⚠️ ¿Borrar TODOS los registros?',
                noRecords: 'No hay autos registrados aún.\n¡Comienza a registrar tu trabajo!',
                exportEmpty: '⚠️ No hay registros para exportar.',
                deleteMsg: '🗑️ Registro eliminado.',
                clearMsg: '🗑️ Todos los registros han sido eliminados.',
                auto: 'auto',
                autos: 'autos',
                vehicles: 'vehículos'
            },
            en: {
                subtitle: 'Work Log',
                configTitle: '⚙️ Start Shift',
                employeeName: '👤 Employee Name',
                start: '🚀 Start Shift',
                registerTitle: '🚗 Register Vehicle',
                newRecord: 'New record',
                date: '📅 Date',
                entryTime: '🕐 Entry Time',
                exitTime: '🕐 Exit Time',
                vehicle: '🚗 Vehicle',
                service: '🔧 Service',
                charge: '💰 Charge ($)',
                tip: '💵 Tip ($)',
                addVehicle: '➕ Add Vehicle',
                listTitle: '📊 Shift Records',
                totalVehicles: 'Total Vehicles',
                totalHours: 'Total Hours',
                totalCharges: 'Total Charges',
                totalTips: 'Total Tips',
                exportExcel: '📊 Export to Excel',
                print: '📄 Print',
                clearAll: '🗑️ Clear All',
                startSuccess: '✅ Shift started for ',
                startError: '⚠️ Enter your name.',
                recordSuccess: '✅ Vehicle "',
                recordError: '⚠️ Enter entry and exit time.',
                deleteConfirm: 'Delete this record?',
                clearConfirm: '⚠️ Delete ALL records?',
                noRecords: 'No vehicles registered yet.\nStart logging your work!',
                exportEmpty: '⚠️ No records to export.',
                deleteMsg: '🗑️ Record deleted.',
                clearMsg: '🗑️ All records have been deleted.',
                auto: 'vehicle',
                autos: 'vehicles',
                vehicles: 'vehicles'
            }
        };

        let idiomaActual = 'es';

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            document.getElementById('btnEs').classList.toggle('active', idioma === 'es');
            document.getElementById('btnEn').classList.toggle('active', idioma === 'en');
            
            const t = textos[idioma];
            document.getElementById('headerSubtitle').textContent = t.subtitle;
            document.getElementById('lblConfigTitle').textContent = t.configTitle;
            document.getElementById('lblEmployeeName').textContent = t.employeeName;
            document.getElementById('btnStart').textContent = t.start;
            document.getElementById('lblRegisterTitle').innerHTML = t.registerTitle + ' <span class="badge" id="lblNewRecord">' + t.newRecord + '</span>';
            document.getElementById('lblDate').textContent = t.date;
            document.getElementById('lblEntryTime').textContent = t.entryTime;
            document.getElementById('lblExitTime').textContent = t.exitTime;
            document.getElementById('lblVehicle').textContent = t.vehicle;
            document.getElementById('lblService').textContent = t.service;
            document.getElementById('lblCharge').textContent = t.charge;
            document.getElementById('lblTip').textContent = t.tip;
            document.getElementById('btnAddVehicle').textContent = t.addVehicle;
            document.getElementById('lblListTitle').innerHTML = t.listTitle + ' <span class="badge" id="totalAutosBadge">0 ' + t.autos + '</span>';
            document.getElementById('lblTotalVehicles').textContent = t.totalVehicles;
            document.getElementById('lblTotalHours').textContent = t.totalHours;
            document.getElementById('lblTotalCharges').textContent = t.totalCharges;
            document.getElementById('lblTotalTips').textContent = t.totalTips;
            document.getElementById('btnExportExcel').textContent = t.exportExcel;
            document.getElementById('btnPrint').textContent = t.print;
            document.getElementById('btnClearAll').textContent = t.clearAll;
        }

        // ============ VARIABLES GLOBALES ============
        let registros = [];
        let empleadoActual = '';

        // ============ INICIALIZAR FECHAS ============
        function inicializarFechas() {
            const hoy = new Date();
            document.getElementById('fechaRegistro').value = formatDateInput(hoy);
        }

        function formatDateInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const month = parts[1];
            const day = parts[2];
            const year = parts[0];
            return `${month}/${day}/${year}`;
        }

        function parseDateInput(dateStr) {
            const parts = dateStr.split('-');
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }

        // ============ INICIAR JORNADA ============
        function iniciarJornada() {
            const nombre = document.getElementById('empleadoNombre').value.trim();

            if (!nombre) {
                mostrarMensaje('configSection', textos[idiomaActual].startError, 'error');
                return;
            }

            empleadoActual = nombre;
            registros = [];

            document.getElementById('configSection').classList.add('hidden');
            document.getElementById('registroSection').classList.remove('hidden');
            document.getElementById('listaSection').classList.remove('hidden');

            const hoy = new Date();
            document.getElementById('fechaRegistro').value = formatDateInput(hoy);

            mostrarMensaje('configSection', textos[idiomaActual].startSuccess + nombre, 'exito');
            actualizarLista();
        }

        // ============ AGREGAR AUTO ============
        function agregarAuto() {
            const fecha = document.getElementById('fechaRegistro').value;
            const horaEntrada = document.getElementById('horaEntrada').value;
            const horaSalida = document.getElementById('horaSalida').value;
            const auto = document.getElementById('auto').value.trim() || 'No especificado';
            const servicio = document.getElementById('servicio').value.trim() || 'No especificado';
            const cobro = parseFloat(document.getElementById('cobro').value) || 0;
            const propina = parseFloat(document.getElementById('propina').value) || 0;

            if (!fecha) {
                mostrarMensaje('registroSection', '⚠️ Selecciona una fecha.', 'error');
                return;
            }

            if (!horaEntrada || !horaSalida) {
                mostrarMensaje('registroSection', textos[idiomaActual].recordError, 'error');
                return;
            }

            const horas = calcularHoras(horaEntrada, horaSalida);

            const registro = {
                fecha: fecha,
                horaEntrada: horaEntrada,
                horaSalida: horaSalida,
                horas: horas,
                auto: auto,
                servicio: servicio,
                cobro: cobro,
                propina: propina
            };

            registros.push(registro);
            actualizarLista();

            document.getElementById('horaEntrada').value = '';
            document.getElementById('horaSalida').value = '';
            document.getElementById('auto').value = '';
            document.getElementById('servicio').value = '';
            document.getElementById('cobro').value = '';
            document.getElementById('propina').value = '';

            document.getElementById('fechaRegistro').value = fecha;

            mostrarMensaje('registroSection', textos[idiomaActual].recordSuccess + auto + '" registrado correctamente.', 'exito');
        }

        // ============ ELIMINAR AUTO ============
        function eliminarAuto(index) {
            if (confirm(textos[idiomaActual].deleteConfirm)) {
                registros.splice(index, 1);
                actualizarLista();
                mostrarMensaje('listaSection', textos[idiomaActual].deleteMsg, 'info');
            }
        }

        // ============ LIMPIAR TODO ============
        function limpiarTodo() {
            if (confirm(textos[idiomaActual].clearConfirm)) {
                registros = [];
                actualizarLista();
                mostrarMensaje('listaSection', textos[idiomaActual].clearMsg, 'info');
            }
        }

        // ============ ACTUALIZAR LISTA ============
        function actualizarLista() {
            const container = document.getElementById('registrosList');
            const t = textos[idiomaActual];

            if (registros.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#555; padding:30px;">${t.noRecords.replace(/\n/g, '<br>')}</p>`;
                actualizarEstadisticas();
                return;
            }

            // Agrupar por fecha
            const grupos = {};
            registros.forEach((r, i) => {
                const fechaKey = r.fecha;
                if (!grupos[fechaKey]) {
                    grupos[fechaKey] = [];
                }
                grupos[fechaKey].push({ ...r, index: i });
            });

            const fechasOrdenadas = Object.keys(grupos).sort();

            let html = '';
            fechasOrdenadas.forEach(fechaKey => {
                const items = grupos[fechaKey];
                const totalDia = items.length;
                const totalCobroDia = items.reduce((sum, r) => sum + r.cobro, 0);
                const totalPropinaDia = items.reduce((sum, r) => sum + r.propina, 0);

                const plural = totalDia > 1 ? t.autos : t.auto;

                html += `
                    <div class="dia-group">
                        <div class="dia-header">
                            <span class="fecha">📅 ${formatDateDisplay(fechaKey)}</span>
                            <span class="total-dia">
                                ${totalDia} ${plural} · 
                                Cobro: <span>$${totalCobroDia.toFixed(2)}</span> · 
                                Propina: <span>$${totalPropinaDia.toFixed(2)}</span>
                            </span>
                        </div>
                        <div class="dia-body">
                `;

                items.forEach((r) => {
                    const horasFormateadas = formatearHoras(r.horas);
                    html += `
                        <div class="registro-item">
                            <div class="info">
                                <span class="auto">🚗 ${r.auto}</span>
                                <span class="detalle">⏱ ${r.horaEntrada} - ${r.horaSalida} · ${horasFormateadas}</span>
                                <span class="detalle">🔧 ${r.servicio}</span>
                                <span class="monto">💰 $${r.cobro.toFixed(2)}</span>
                                <span class="monto" style="color:#ff9800;">💵 $${r.propina.toFixed(2)}</span>
                            </div>
                            <div class="acciones">
                                <button class="btn btn-danger btn-xs" onclick="eliminarAuto(${r.index})">🗑️</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            actualizarEstadisticas();

            document.getElementById('totalAutosBadge').textContent = `${registros.length} ${registros.length > 1 ? t.autos : t.auto}`;
        }

        // ============ ESTADÍSTICAS ============
        function actualizarEstadisticas() {
            document.getElementById('totalAutos').textContent = registros.length;

            const totalHoras = registros.reduce((sum, r) => sum + r.horas, 0);
            document.getElementById('totalHoras').textContent = formatearHoras(totalHoras);

            const totalCobro = registros.reduce((sum, r) => sum + r.cobro, 0);
            document.getElementById('totalCobros').textContent = `$${totalCobro.toFixed(2)}`;

            const totalPropina = registros.reduce((sum, r) => sum + r.propina, 0);
            document.getElementById('totalPropinas').textContent = `$${totalPropina.toFixed(2)}`;
        }

        // ============ EXPORTAR A EXCEL ============
        function exportarExcel() {
            const t = textos[idiomaActual];

            if (registros.length === 0) {
                alert(t.exportEmpty);
                return;
            }

            const headers = ['#', 'Fecha', 'Hora Entrada', 'Hora Salida', 'Horas', 'Auto', 'Servicio', 'Cobro', 'Propina'];
            let csv = headers.join(',') + '\n';

            registros.forEach((r, i) => {
                const row = [
                    i + 1,
                    formatDateDisplay(r.fecha),
                    r.horaEntrada,
                    r.horaSalida,
                    r.horas.toFixed(2).replace('.', ','),
                    `"${r.auto}"`,
                    `"${r.servicio}"`,
                    r.cobro.toFixed(2).replace('.', ','),
                    r.propina.toFixed(2).replace('.', ',')
                ];
                csv += row.join(',') + '\n';
            });

            const totalHoras = registros.reduce((sum, r) => sum + r.horas, 0);
            const totalCobro = registros.reduce((sum, r) => sum + r.cobro, 0);
            const totalPropina = registros.reduce((sum, r) => sum + r.propina, 0);

            csv += '\nTOTALES,,,,,' + totalHoras.toFixed(2).replace('.', ',') + ',,' + totalCobro.toFixed(2).replace('.', ',') + ',' + totalPropina.toFixed(2).replace('.', ',');

            csv += `\n\nEmpleado: ${empleadoActual}`;
            csv += `\nCapitol Shine - Detailing & Auto Spa`;

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `CapitolShine_${empleadoActual}_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ============ CÁLCULO DE HORAS ============
        function calcularHoras(entrada, salida) {
            const [h1, m1] = entrada.split(':').map(Number);
            const [h2, m2] = salida.split(':').map(Number);
            let horas = h2 - h1;
            let minutos = m2 - m1;
            if (minutos < 0) {
                horas--;
                minutos += 60;
            }
            if (horas < 0) horas += 24;
            return horas + (minutos / 60);
        }

        function formatearHoras(horas) {
            if (!horas || horas === 0) return '0h';
            const h = Math.floor(horas);
            const m = Math.round((horas - h) * 60);
            if (m === 0) return `${h}h`;
            return `${h}h ${m}min`;
        }

        // ============ MENSAJES ============
        function mostrarMensaje(sectionId, mensaje, tipo) {
            const section = document.getElementById(sectionId);
            const container = section.querySelector('.mensaje, #mensajeConfig, #mensajeRegistro') || section;
            const existing = container.querySelector('.mensaje');
            if (existing) existing.remove();

            const div = document.createElement('div');
            div.className = `mensaje mensaje-${tipo}`;
            div.textContent = mensaje;
            container.appendChild(div);

            setTimeout(() => {
                if (div.parentNode) div.remove();
            }, 5000);
        }

        // ============ INICIALIZAR ============
        inicializarFechas();

        console.log('✨ Capitol Shine - Sistema de Registro cargado');
        console.log('📱 Optimizado para PC y Celular');
        console.log('🌍 Idiomas: Español/Inglés');
        console.log('🚗 Múltiples autos por día');
    </script>
